name: BloretLauncherSetup Windows x64

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        shell: pwsh
        run: python -m pip install --upgrade pip pyinstaller PyQt5
      - name: Compile and offline tests
        shell: pwsh
        run: |
          python -m py_compile installer.py blsetup\*.py tests\*.py
          python -m pytest -q tests
      - name: Build single user-deliverable EXE
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force build, dist -ErrorAction SilentlyContinue
          pyinstaller --clean --noconfirm BloretLauncherSetup.spec
      - name: Smoke test release directory
        shell: pwsh
        run: |
          $files = Get-ChildItem dist -File
          if ($files.Count -ne 1 -or $files[0].Name -ne "BloretLauncherSetup.exe") { throw "dist must contain exactly one user-deliverable EXE" }
          if ($files[0].Extension -ne ".exe") { throw "release artifact is not an EXE" }
      - uses: actions/upload-artifact@v4
        with:
          name: BloretLauncherSetup-Windows-x64
          path: dist/BloretLauncherSetup.exe
